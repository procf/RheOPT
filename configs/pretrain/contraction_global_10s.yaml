# Newtonian pretraining, planar contraction, Global normalization, ten input frames (SI).
# 200 Newtonian simulations, 600 epochs, batch 16; validation loss logged on the training set (as originally run).
geometry: contraction
normalization: global
time_window: 10
wall_mask: contraction_no_step
velocity_scaling: non_newtonian
train_path: '{data_root}/contraction/Newtonian'
valid_path: '{data_root}/contraction/Newtonian'
epochs: 600
val_every: 200
seed: 1
run_dir: '{runs_root}/pretrain/contraction_global_10s'
