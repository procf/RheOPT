# Wake behind a triangular obstacle, Oldroyd-B, global normalization, ten input frames. N = 4, 8, 12, 16, 24, 32.
# 2001 epochs, batch 4. wall_mask and velocity_scaling are those of the original runs (docs/PROTOCOL_NOTES.md).
geometry: wake
normalization: global
time_window: 10
wall_mask: triangle
velocity_scaling: all
train_path: '{data_root}/wake/{fluid}/finetune_N{n}'
valid_path: '{data_root}/wake/{fluid}/validation'
source_path: '{data_root}/wake/Newtonian'
pretrained_path: '{runs_root}/pretrain/wake_global/pretrained.pth'
epochs: 2001
val_every: 100
fluid: Oldroyd
run_dir: '{runs_root}/wake_global/{fluid}/N{n}/{arm}_seed{seed}'
